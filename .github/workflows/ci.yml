name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Native desktop lifecycle smoke
        run: pnpm desktop:smoke performance-results/native-smoke.json

      - name: Native desktop startup baseline
        run: node scripts/performance/desktop.mjs

      - name: Design system gallery review
        run: pnpm ui:check

      - name: Check the built desktop Markdown worker
        run: node apps/web/scripts/performance-browser.mjs "$GITHUB_WORKSPACE/performance-results/desktop-worker.json" --production --worker-smoke
        env:
          AGENTCTL_PERF_DIST: ${{ github.workspace }}/apps/desktop/out/renderer

      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ github.sha }}
          path: performance-results/
          retention-days: 14
          if-no-files-found: warn

  performance:
    name: Web performance safeguards
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify installed Chrome
        run: google-chrome --version

      - name: Build production web app and workspace dependencies
        run: pnpm exec vp run --filter '@agentctl/web...' compile

      - name: Build profiling fixtures
        run: pnpm --filter @agentctl/web perf:build

      - name: Check performance budgets and collect timing trends
        run: pnpm --filter @agentctl/web perf:check "$GITHUB_WORKSPACE/performance-results/ci"

      - name: Upload performance reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-performance-${{ github.sha }}
          path: performance-results/ci/
          retention-days: 14
          if-no-files-found: warn

  backend-performance:
    name: Backend baseline and concurrency safeguards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build server and workspace dependencies
        run: pnpm exec vp run --filter '@agentctl/server...' compile
      - name: Concurrency, backpressure and process recovery
        run: pnpm exec vp test run apps/server/tests/performance/concurrency.test.ts
        env:
          NODE_ENV: test
          LOG_LEVEL: silent
      - name: Check relative decoder regression budget
        run: pnpm perf:test && node scripts/performance/backend-checks.mjs decoding
      - name: Sustained 20-session concurrency smoke
        run: node scripts/performance/backend-checks.mjs soak performance-results/soak 60 --full-retention
      - name: Collect isolated backend baselines
        run: pnpm --filter @agentctl/server perf:baseline
      - name: Upload backend baseline and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-performance-${{ github.sha }}
          path: |
            performance-results/backend/
            performance-results/decoding/
            performance-results/soak/
          retention-days: 14
          if-no-files-found: warn
