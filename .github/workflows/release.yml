name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Core packages & Web App
        run: pnpm build

      - name: Package Desktop App for Linux (AppImage)
        run: pnpm --filter @agentctl/desktop package:linux

      - name: Create GitHub Release and Upload AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/AgentCtl-*.AppImage
            apps/desktop/release/latest*.yml
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
