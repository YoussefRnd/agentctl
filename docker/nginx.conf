# Runs unprivileged (uid 1000): pid file and temp paths live under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # WebSocket connections are upgraded; plain HTTP keeps the header empty.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream agentctl_api {
        server 127.0.0.1:3000;
    }

    server {
        listen 8080;
        server_name _;

        root /app/web;
        index index.html;

        # Attachment uploads are capped at 20 MiB by the server.
        client_max_body_size 25m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # API, server-sent events, attachment downloads and terminal websockets.
        location /api/ {
            proxy_pass http://agentctl_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Streaming responses must not be buffered; they stay open for a long time.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location = /health {
            proxy_pass http://agentctl_api/health;
            proxy_set_header Host $host;
        }

        # Hashed Vite assets are content-addressed and can be cached forever.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Client-side routing: unknown paths render the SPA shell.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
