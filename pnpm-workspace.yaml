packages:
  - ./apps/*
  - ./packages/*
# TypeScript 7 (native tsc) + TypeScript 6 (JS API for eslint / tooling).
# Keep both until TS 7.1+ ships a stable programmatic API and the ecosystem
# (typescript-eslint, etc.) can consume it directly.
catalog:
  '@typescript/native': npm:typescript@^7.0.2
  typescript: npm:@typescript/typescript6@^6.0.2
allowBuilds:
  better-sqlite3: true
  electron-winstaller: true
  electron: true
  esbuild: true
  msw: false
