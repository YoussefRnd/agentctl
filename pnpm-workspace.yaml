packages:
  - apps/*
  - packages/*
# TypeScript 7 (native tsc) + TypeScript 6 (JS API for eslint / tooling).
# Keep both until TS 7.1+ ships a stable programmatic API and the ecosystem
# (typescript-eslint, etc.) can consume it directly.
catalog:
  '@typescript/native': npm:typescript@^7.0.2
  typescript: npm:@typescript/typescript6@^6.0.2
allowBuilds:
  better-sqlite3: false
  electron-winstaller: true
  electron: true
  esbuild: true
  msw: false

peerDependencyRules:
  allowedVersions:
    vite: '8'
    zod: '4'
    fastify: '5'
    eslint: '9'

overrides:
  esbuild: '>=0.28.1'
  '@babel/core': '>=7.29.1'
  hono: '>=4.12.27'
  tar: '>=7.5.21'
  brace-expansion: '>=1.1.11 || >=2.0.1'
  js-yaml: '>=4.1.2'
  '@hono/node-server': '>=2.0.5'
  find-my-way: '>=9.6.1'
patchedDependencies:
  app-builder-lib: patches/app-builder-lib.patch
