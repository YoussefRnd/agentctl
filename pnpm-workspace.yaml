packages:
  - apps/*
  - packages/*
# TypeScript 7 (native tsc) + TypeScript 6 (JS API for eslint / tooling).
# Keep both until TS 7.1+ ships a stable programmatic API and the ecosystem
# (typescript-eslint, etc.) can consume it directly.
catalog:
  '@typescript/native': npm:typescript@^7.0.2
  typescript: npm:@typescript/typescript6@^6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
allowBuilds:
  better-sqlite3: false
  electron-winstaller: true
  electron: true
  esbuild: true

peerDependencyRules:
  allowedVersions:
    '@xterm/xterm': '*'
    vite: '*'
    zod: '4'
    fastify: '5'
    vitest: '*'
  allowAny:
    - vite
    - vitest

overrides:
  '@simple-git/argv-parser': '>=2.0.1'
  esbuild: '>=0.28.1'
  postcss-selector-parser: '>=6.1.5'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
